name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Run Analysis & Render Report
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::httr2
            any::xml2
            any::quantmod
            any::zoo
            any::tseries
            any::urca
            any::PerformanceAnalytics
            any::xts
            any::scales
            any::patchwork
            any::knitr
            any::kableExtra
            any::rmarkdown

      - name: Execute Main Analysis Pipeline
        run: |
          Rscript main.R

      - name: Render Research Report
        run: |
          Rscript -e "rmarkdown::render('report.Rmd', output_file='report.html')"

      - name: Upload Research Report and Plots
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: |
            report.html
            output/plots/*.png
            output/results/*.csv
