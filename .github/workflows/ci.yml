name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Run Analysis & Render Report
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev gfortran

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/R/*.R', 'main.R', 'report.Rmd') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R Dependencies
        run: |
          Rscript -e '
            required_pkgs <- c(
              "tidyverse", "httr2", "xml2", "quantmod", "zoo",
              "tseries", "urca", "PerformanceAnalytics", "xts",
              "scales", "patchwork", "knitr", "kableExtra", "rmarkdown"
            )
            new_pkgs <- required_pkgs[!(required_pkgs %in% installed.packages()[, "Package"])]
            if (length(new_pkgs) > 0) {
              install.packages(new_pkgs, repos = "https://cloud.r-project.org", Ncpus = 2)
            }
          '

      - name: Execute Main Analysis Pipeline
        run: |
          Rscript main.R

      - name: Render Research Report
        run: |
          Rscript -e "rmarkdown::render('report.Rmd', output_file='report.html')"

      - name: Upload Research Report and Plots
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: |
            report.html
            output/plots/*.png
            output/results/*.csv
